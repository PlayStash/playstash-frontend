[package]
name = "app"
version = "17.2.3"
description = "The self-hosted gaming platform for DRM-free games"
authors = ["Phalcode"]
license = "CC BY-NC-SA 4.0"
repository = "https://github.com/PlayStash/playstash-frontend"
homepage = "https://github.com/PlayStash/playstash-frontend"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
base64 = "0.22"
semver = "1"
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
sevenz-rust2 = { version = "0.20.2", features = ["aes256"] }
tauri-plugin-stronghold = "2"
getrandom = "0.2"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3.31"
sysinfo = "0.33"
zip = "2.4.2"
url = "2"
urlencoding = "2.1.3"
unrar = "0.5.8"
tar = "0.4.44"
flate2 = "1.1.2"
bzip2 = "0.5.2"
xz2 = "0.1.7"
zstd = "0.13.3"
isomage = "2.1.0"

# Feature package dependencies: add them inside your own block only.
# ── WP1 os-integration: begin ──
# ── WP1 os-integration: end ──
# ── WP2 community: begin ──
# ── WP2 community: end ──
# ── WP3 cloud-saves: begin ──
# ── WP3 cloud-saves: end ──
# ── WP4 launch: begin ──
# ── WP4 launch: end ──
# ── WP5 download-pipeline: begin ──
# ── WP5 download-pipeline: end ──
# ── WP6 accounts: begin ──
# ── WP6 accounts: end ──
# ── WP7 appearance: begin ──
# ── WP7 appearance: end ──

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "shellapi", "winnt", "winuser", "synchapi", "handleapi", "winbase", "winerror", "processthreadsapi", "sysinfoapi"] }
# ── WP1 os-integration: begin ──
# ── WP1 os-integration: end ──
# ── WP2 community: begin ──
# ── WP2 community: end ──
# ── WP3 cloud-saves: begin ──
# ── WP3 cloud-saves: end ──
# ── WP4 launch: begin ──
# ── WP4 launch: end ──
# ── WP5 download-pipeline: begin ──
# ── WP5 download-pipeline: end ──
# ── WP6 accounts: begin ──
# ── WP6 accounts: end ──
# ── WP7 appearance: begin ──
# Native startup-sound playback (WASAPI, no system libraries needed).
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
# ── WP7 appearance: end ──

[target.'cfg(target_os = "linux")'.dependencies]
# Direct dependency so we can read/configure WebKitGTK WebKitSettings at runtime
# (smooth scrolling, hardware acceleration policy) for the DevTools "Rendering"
# section. Already a transitive dependency of tauri/wry on Linux; the `v2_16`
# feature gates the hardware-acceleration-policy API.
webkit2gtk = { version = "2", features = ["v2_16"] }
# ── WP1 os-integration: begin ──
# ── WP1 os-integration: end ──
# ── WP2 community: begin ──
# ── WP2 community: end ──
# ── WP3 cloud-saves: begin ──
# ── WP3 cloud-saves: end ──
# ── WP4 launch: begin ──
# ── WP4 launch: end ──
# ── WP5 download-pipeline: begin ──
# ── WP5 download-pipeline: end ──
# ── WP6 accounts: begin ──
# ── WP6 accounts: end ──
# ── WP7 appearance: begin ──
# ── WP7 appearance: end ──

[target.'cfg(unix)'.dependencies]
# ── WP1 os-integration: begin ──
# ── WP1 os-integration: end ──
# ── WP2 community: begin ──
# ── WP2 community: end ──
# ── WP3 cloud-saves: begin ──
# ── WP3 cloud-saves: end ──
# ── WP4 launch: begin ──
# ── WP4 launch: end ──
# ── WP5 download-pipeline: begin ──
# ── WP5 download-pipeline: end ──
# ── WP6 accounts: begin ──
# ── WP6 accounts: end ──
# ── WP7 appearance: begin ──
# ── WP7 appearance: end ──

# Recommended by the tauri-plugin-stronghold docs to work around an upstream
# scrypt performance bug in dev builds.
[profile.dev.package.scrypt]
opt-level = 3

# GTK3 currently requires glib 0.18. This checked-in crate contains the exact
# upstream VariantStrIter safety fix; see vendor/glib/PLAYSTASH-PATCH.md.
[patch.crates-io]
glib = { path = "vendor/glib" }
