[package]
name = "app"
version = "17.3.4"
description = "The self-hosted gaming platform for DRM-free games"
authors = ["PlayStash"]
license = "CC BY-NC-SA 4.0"
repository = "https://github.com/PlayStash/playstash-frontend"
homepage = "https://github.com/PlayStash/playstash-frontend"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
base64 = "0.22"
semver = "1"
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
sevenz-rust2 = { version = "0.20.2", features = ["aes256"] }
tauri-plugin-stronghold = "2"
getrandom = "0.2"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3.31"
sysinfo = "0.33"
zip = "2.4.2"
url = "2"
urlencoding = "2.1.3"
unrar = "0.5.8"
tar = "0.4.44"
flate2 = "1.1.2"
bzip2 = "0.5.2"
xz2 = "0.1.7"
zstd = "0.13.3"
isomage = "2.1.0"

# Desktop integration dependencies.
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
discord-rich-presence = "0.2"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "shellapi", "winnt", "winuser", "synchapi", "handleapi", "winbase", "winerror", "processthreadsapi", "sysinfoapi"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
# DPAPI (legacy WPF data import), directory junctions and the job object that
# keeps helper processes from outliving the app.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }
# Native startup-sound playback (WASAPI, no system libraries needed).
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct dependency so we can read/configure WebKitGTK WebKitSettings at runtime
# (smooth scrolling, hardware acceleration policy) for the DevTools "Rendering"
# section. Already a transitive dependency of tauri/wry on Linux; the `v2_16`
# feature gates the hardware-acceleration-policy API.
webkit2gtk = { version = "2", features = ["v2_16"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Recommended by the tauri-plugin-stronghold docs to work around an upstream
# scrypt performance bug in dev builds.
[profile.dev.package.scrypt]
opt-level = 3

# GTK3 currently requires glib 0.18. This checked-in crate contains the exact
# upstream VariantStrIter safety fix; see vendor/glib/PLAYSTASH-PATCH.md.
[patch.crates-io]
glib = { path = "vendor/glib" }
