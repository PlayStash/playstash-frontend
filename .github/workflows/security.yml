name: Security checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts='--all' --redact=100 --no-banner --report-format json --report-path "$RUNNER_TEMP/secrets.json"
      - name: Keep redacted findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redacted-secret-scan
          path: ${{ runner.temp }}/secrets.json
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Audit all production and development packages
        run: pnpm audit --audit-level=low

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit native dependencies
        working-directory: src-tauri
        run: cargo audit
      - name: Audit the complete patched Ludusavi dependency graph
        run: cargo audit --file tooling/ludusavi/Cargo.lock --deny unsound
      - name: Install GLib regression prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev pkg-config
      - name: Verify the GLib source backport with optimized iterator tests
        working-directory: src-tauri/vendor/glib
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/playstash-glib-regression-target
        run: cargo test --release --lib variant_iter::tests
