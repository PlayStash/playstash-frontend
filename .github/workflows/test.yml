name: Test

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve API spec hash
        id: api-spec
        env:
          PLAYSTASH_API_SPEC_URL: ${{ vars.PLAYSTASH_API_SPEC_URL }}
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          if [ -n "$PLAYSTASH_API_SPEC_URL" ]; then
            curl -fsSL "$PLAYSTASH_API_SPEC_URL" -o "$SPEC_FILE"
          else
            cp api-spec/playstash.openapi.json "$SPEC_FILE"
          fi
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v6
        with:
          path: src/api
          key: playstash-api-v1-${{ steps.api-spec.outputs.hash }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Java for API generation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        env:
          PLAYSTASH_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check dependency advisories
        run: pnpm audit --audit-level=low

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build

      - name: Check separate frontend runtime
        run: pnpm test:runtime

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  ludusavi:
    name: Patched Ludusavi sidecar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test the build script
        run: node --test scripts/build-ludusavi.test.mjs

      - name: Verify pinned lockfile and patches
        run: node scripts/build-ludusavi.mjs --check-pins

      # Same packages as upstream Ludusavi's CI (GUI/clipboard dependencies).
      - name: Install Ludusavi build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev

      # Exact-key cache only: Cargo registry downloads and the separate target
      # directory, saved after every audit/test/build/smoke check passed.
      - name: Restore Ludusavi build cache
        id: ludusavi-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ${{ runner.temp }}/ludusavi-target
          key: ludusavi-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-${{ hashFiles('tooling/ludusavi/**', 'scripts/build-ludusavi.mjs') }}

      # Audit, upstream tests, release build, format check and CLI smoke test.
      - name: Build the patched Ludusavi sidecar
        run: node scripts/build-ludusavi.mjs --upstream-tests --target x86_64-unknown-linux-gnu --target-dir "$RUNNER_TEMP/ludusavi-target" --out "$RUNNER_TEMP/ludusavi-out"

      - name: Keep the verified sidecar for native integration tests
        uses: actions/upload-artifact@v7
        with:
          name: ludusavi-linux-test-sidecar
          path: ${{ runner.temp }}/ludusavi-out/ludusavi-x86_64-unknown-linux-gnu
          if-no-files-found: error
          retention-days: 1

      - name: Save Ludusavi build cache
        if: success() && steps.ludusavi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ${{ runner.temp }}/ludusavi-target
          key: ludusavi-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-${{ hashFiles('tooling/ludusavi/**', 'scripts/build-ludusavi.mjs') }}

  rust:
    name: Rust tests (Linux)
    needs: ludusavi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxcb-composite0-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download the verified sidecar
        uses: actions/download-artifact@v8
        with:
          name: ludusavi-linux-test-sidecar
          path: src-tauri/binaries

      - name: Make the test sidecar executable
        run: chmod +x src-tauri/binaries/ludusavi-x86_64-unknown-linux-gnu

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify real cloud-save backup and restore with local game manifests
        working-directory: src-tauri
        run: cargo test --locked --lib cloud_saves::tests::ludusavi -- --ignored --nocapture
