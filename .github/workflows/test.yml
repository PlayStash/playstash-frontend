name: Test

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ vars.PLAYSTASH_RUN_WORKFLOWS == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve API spec hash
        id: api-spec
        env:
          PLAYSTASH_API_SPEC_URL: ${{ vars.PLAYSTASH_API_SPEC_URL }}
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          if [ -n "$PLAYSTASH_API_SPEC_URL" ]; then
            curl -fsSL "$PLAYSTASH_API_SPEC_URL" -o "$SPEC_FILE"
          else
            cp api-spec/playstash.openapi.json "$SPEC_FILE"
          fi
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v6
        with:
          path: src/api
          key: playstash-api-v1-${{ steps.api-spec.outputs.hash }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        env:
          PLAYSTASH_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  rust:
    if: ${{ vars.PLAYSTASH_RUN_WORKFLOWS == 'true' }}
    name: Rust tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
