name: Deploy

on:
  push:
    branches:
      - main
      - dev
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.current-version }}
      publish_stable: ${{ steps.publish-plan.outputs.publish_stable }}
      publish_unstable: ${{ steps.publish-plan.outputs.publish_unstable }}
      upload_draft: ${{ steps.publish-plan.outputs.upload_draft }}
      release_tag: ${{ steps.publish-plan.outputs.release_tag }}
      build_version: ${{ steps.build-info.outputs.build_version }}
      build_channel: ${{ steps.build-info.outputs.build_channel }}
      build_commit: ${{ steps.build-info.outputs.build_commit }}
      build_id: ${{ steps.build-info.outputs.build_id }}
      release_ref: ${{ steps.build-info.outputs.release_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Current Package Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Compute build metadata
        id: build-info
        env:
          PLAYSTASH_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'unstable' || 'stable' }}
        run: node scripts/compute-build-info.mjs package.json

      - name: Resolve API spec hash
        id: api-spec
        env:
          PLAYSTASH_API_SPEC_URL: ${{ vars.PLAYSTASH_API_SPEC_URL }}
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          if [ -n "$PLAYSTASH_API_SPEC_URL" ]; then
            curl -fsSL "$PLAYSTASH_API_SPEC_URL" -o "$SPEC_FILE"
          else
            cp api-spec/playstash.openapi.json "$SPEC_FILE"
          fi
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v6
        with:
          path: src/api
          key: playstash-api-v1-${{ steps.api-spec.outputs.hash }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Java for API generation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        env:
          PLAYSTASH_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build
        env:
          PLAYSTASH_BUILD_VERSION: ${{ steps.build-info.outputs.build_version }}
          PLAYSTASH_BUILD_CHANNEL: ${{ steps.build-info.outputs.build_channel }}
          PLAYSTASH_BUILD_COMMIT: ${{ steps.build-info.outputs.build_commit }}
          PLAYSTASH_BUILD_ID: ${{ steps.build-info.outputs.build_id }}
          PLAYSTASH_RELEASE_REF: ${{ steps.build-info.outputs.release_ref }}
        run: pnpm run build

      - name: Zip dist folder
        run: zip -r playstash-frontend.zip dist

      - name: Plan immutable stable release
        id: publish-plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plan-release.mjs

      - name: Upload web build as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: playstash-web-${{ steps.build-info.outputs.build_commit }}
          path: |
            playstash-frontend.zip
            Dockerfile.runtime
            nginx.runtime.conf
            start-runtime.sh

      - name: Upload web build to new draft release
        if: steps.publish-plan.outputs.upload_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.publish-plan.outputs.release_tag }}" playstash-frontend.zip Dockerfile.runtime nginx.runtime.conf start-runtime.sh --clobber

      - name: Download coverage report
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && vars.PLAYSTASH_SONAR_PROJECT_KEY != '' && vars.PLAYSTASH_SONAR_ORGANIZATION != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.PLAYSTASH_SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.PLAYSTASH_SONAR_ORGANIZATION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tauri:
    name: Build Tauri (${{ matrix.platform }} ${{ matrix.arch }})
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: ""
          - os: windows-latest
            platform: windows
            arch: x64
            target: ""
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: macos
            arch: x64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve API spec hash
        id: api-spec
        env:
          PLAYSTASH_API_SPEC_URL: ${{ vars.PLAYSTASH_API_SPEC_URL }}
        shell: bash
        run: |
          SPEC_FILE="$RUNNER_TEMP/api-spec.yaml"
          if [ -n "$PLAYSTASH_API_SPEC_URL" ]; then
            curl -fsSL "$PLAYSTASH_API_SPEC_URL" -o "$SPEC_FILE"
          else
            cp api-spec/playstash.openapi.json "$SPEC_FILE"
          fi
          echo "hash=$(sha256sum "$SPEC_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Cache generated API client
        uses: actions/cache@v6
        with:
          path: src/api
          key: playstash-api-v1-${{ steps.api-spec.outputs.hash }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          # The gstreamer plugin packages provide the media elements WebKitGTK
          # looks up at runtime. The AppImage bundler copies every installed
          # plugin verbatim (`bundleMediaFramework: true`), so only what is
          # listed here ends up inside the AppImage:
          #   -plugins-base: appsink, ogg/vorbis, opus, isomp4
          #   -plugins-good: autoaudiosink, vpx (VP8/VP9), matroska
          #   -plugins-bad:  fakevideosink, WebVTT encoder, H.264 (openh264), AAC (faad)
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Java for API generation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        env:
          PLAYSTASH_API_SPEC_PATH: ${{ steps.api-spec.outputs.file }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate updater signing configuration
        shell: bash
        env:
          PLAYSTASH_TAURI_UPDATER_PUBKEY: ${{ vars.PLAYSTASH_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$PLAYSTASH_TAURI_UPDATER_PUBKEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Generate Tauri release config
        env:
          PLAYSTASH_TAURI_UPDATER_PUBKEY: ${{ vars.PLAYSTASH_TAURI_UPDATER_PUBKEY }}
        run: node scripts/write-tauri-release-config.mjs src-tauri/tauri.release.conf.json src-tauri/tauri.release.generated.json

      - name: Write Cargo build version
        run: node scripts/write-cargo-version.mjs src-tauri/Cargo.toml ${{ needs.release.outputs.build_version }}

      - name: Write AppStream metainfo
        run: node scripts/write-tauri-metainfo.mjs

      - name: Build installers with official Tauri action
        uses: tauri-apps/tauri-action@v1
        env:
          PLAYSTASH_TAURI_UPDATER_PUBKEY: ${{ vars.PLAYSTASH_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLAYSTASH_BUILD_VERSION: ${{ needs.release.outputs.build_version }}
          PLAYSTASH_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
          PLAYSTASH_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          PLAYSTASH_BUILD_ID: ${{ needs.release.outputs.build_id }}
          PLAYSTASH_RELEASE_REF: ${{ needs.release.outputs.release_ref }}
        with:
          args: --config src-tauri/tauri.release.generated.json ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: Patch AppImage AppRun (Wayland libwayland fix)
        if: matrix.os == 'ubuntu-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/patch-appimage-apprun.mjs

      - name: Prepare Tauri release assets
        env:
          PLAYSTASH_TARGET_TRIPLE: ${{ matrix.target }}
          PLAYSTASH_TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/prepare-tauri-release-assets.mjs ${{ matrix.platform }} ${{ needs.release.outputs.build_version }}

      - name: Upload Tauri release assets
        if: needs.release.outputs.upload_draft == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.release_tag }}" release-assets/${{ matrix.platform }}/* --clobber

      - name: Upload platform installers as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: playstash-installers-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.release.outputs.build_commit }}
          path: release-assets/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: updater-metadata-${{ matrix.platform }}-${{ matrix.arch }}
          path: updater-metadata/*.json

  cleanup-release:
    name: Clean stale release assets
    needs: [release, tauri, updater-manifest]
    # Keep the current feed and its assets untouched after failed builds.
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && needs.updater-manifest.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean prerelease release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/cleanup-release-assets.mjs "${{ github.repository }}" unstable --keep-version "${{ needs.updater-manifest.outputs.published_version }}"

  updater-manifest:
    name: Publish updater manifest
    needs: [release, tauri]
    if: ${{ !cancelled() && (needs.release.outputs.publish_stable == 'true' || needs.release.outputs.publish_unstable == 'true') && needs.release.result == 'success' && needs.tauri.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published_version: ${{ steps.unstable-publisher.outputs.published_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download updater metadata
        uses: actions/download-artifact@v8
        with:
          pattern: updater-metadata-*
          path: updater-metadata
          merge-multiple: true

      - name: Determine updater manifest target
        id: manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "channel=unstable" >> "$GITHUB_OUTPUT"
            echo "file=unstable.json" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "asset_tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "file=latest.json" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "asset_tag=${{ needs.release.outputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download existing updater channels source
        if: needs.release.outputs.upload_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/read-updater-channels.mjs

      - name: Build current channel manifest
        if: needs.release.outputs.upload_draft == 'true'
        env:
          PLAYSTASH_BUILD_COMMIT: ${{ needs.release.outputs.build_commit }}
          PLAYSTASH_BUILD_ID: ${{ needs.release.outputs.build_id }}
          PLAYSTASH_BUILD_CHANNEL: ${{ needs.release.outputs.build_channel }}
        run: node scripts/build-tauri-updater-manifest.mjs ${{ needs.release.outputs.build_version }} updater-metadata current-channel.json ${{ github.repository }} ${{ steps.manifest.outputs.asset_tag }}

      - name: Merge updater channels source
        if: needs.release.outputs.upload_draft == 'true'
        run: node scripts/merge-tauri-updater-channels.mjs existing-updater-channels.json ${{ steps.manifest.outputs.channel }} current-channel.json updater-channels.json

      - name: Extract updater feed for current channel
        if: needs.release.outputs.upload_draft == 'true'
        run: node scripts/extract-tauri-updater-channel.mjs updater-channels.json ${{ steps.manifest.outputs.channel }} ${{ steps.manifest.outputs.file }}

      - name: Upload updater manifest
        if: needs.release.outputs.upload_draft == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.manifest.outputs.tag }}" "${{ steps.manifest.outputs.file }}" --clobber

      - name: Upload updater channels source
        if: needs.release.outputs.upload_draft == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.manifest.outputs.tag }}" updater-channels.json --clobber

      - name: Publish completed stable release
        if: needs.release.outputs.publish_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release.outputs.release_tag }}" --draft=false --latest

      - name: Publish completed unstable build and promote channel
        id: unstable-publisher
        if: needs.release.outputs.publish_unstable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-unstable.mjs "${{ needs.release.outputs.release_tag }}" "${{ needs.release.outputs.build_version }}"

      - name: Send Discord Notification
        if: needs.release.outputs.publish_stable == 'true' && vars.PLAYSTASH_DISCORD_NOTIFICATIONS == 'true'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_BOT_WEBHOOK }}
        with:
          args: "PlayStash ${{ needs.release.outputs.version }} is available: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.release_tag }}"
